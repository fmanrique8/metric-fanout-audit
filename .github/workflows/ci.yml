name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked fanout-audit check examples/orders-refunds/repaired.toml
      - name: Check expected fanout exit codes
        shell: bash
        run: |
          for scenario in orders-refunds signed-adjustments; do
            status=0
            uv run --locked fanout-audit check "examples/$scenario/fanout.toml" || status=$?
            test "$status" -eq 1
          done
